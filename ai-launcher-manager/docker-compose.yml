services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      AILM_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./:/app
      - ${HOME}/.codex:/root/.codex:ro
      - ${HOME}/.config/claude:/root/.config/claude:ro

volumes:
  redis-data:
