services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      AILM_REDIS_URL: redis://redis:6379/0
      AILM_ENABLE_BACKGROUND_WORKER: "false"
    ports:
      - "8003:8000"
    depends_on:
      - redis
    volumes:
      - ./:/app

volumes:
  redis-data:
